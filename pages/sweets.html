<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sweets - JD Foods</title>

    <link rel="stylesheet" href="../css/style.css">
</head>
<a
    href="https://wa.me/8500784149"
    target="_blank"
    class="floating-whatsapp"
>
    <img
        src="..\images\WhatsApp.jpg"
        alt="WhatsApp"
    >
</a>

<!-- ORDER MODAL -->

<div id="orderModal" class="modal">

    <div class="modal-content">

        <span class="close-btn" onclick="closeModal()">
            &times;
        </span>

        <h2 id="modalProductName"></h2>

        <label id="quantityLabel">Quantity (Kg)</label>

        <input
            type="number"
            id="quantityInput"
            min="0.25"
            step="0.25"
            value="1"
        >

        <h3 id="calculatedPrice">
            Price: ₹0
        </h3>

        <input
            type="text"
            id="customerName"
            placeholder="Full Name"
        >

        <input
            type="tel"
            id="customerPhone"
            placeholder="Phone Number"
        >

        <textarea
            id="customerAddress"
            placeholder="Complete Address"
            rows="4"
        ></textarea>

        <input
            type="text"
            id="customerPincode"
            placeholder="Pincode"
        >

        <button
            class="whatsapp-btn"
            onclick="sendWhatsAppOrder()"
        >
            Order on WhatsApp
        </button>

    </div>

</div>
<body>

    <header>
        <nav class="navbar">

            <a 
                href="../index.html"
                class="logo-container"
                style="text-decoration:none;color:white;">
                <img src="../images/logo.jpeg"
                     alt="Logo"
                     class="logo">

                <h1>JD Foods</h1>
            </a>

            <a href="../index.html"
               style="color:white;text-decoration:none;">
               Home
            </a>

        </nav>
    </header>

    <section class="categories">

        <h2 class="section-title">
            Sweets
        </h2>

        <div id="products-container"
             class="product-grid">

        </div>

    </section>

    <script src="../js/app.js"></script>

    <script>
        loadProducts("sweets");
    </script>

</body>

</html>
